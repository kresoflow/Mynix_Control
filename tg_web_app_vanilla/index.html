<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mynix Control Web</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0F1218;
      --surface: #1C2029;
      --card: #272C39;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --primary: #F59E0B;
      --border: rgba(255, 255, 255, 0.08);
      
      /* Telegram theme vars fallback */
      --tg-bg: var(--tg-theme-bg-color, var(--bg));
      --tg-text: var(--tg-theme-text-color, var(--text));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: var(--tg-safe-area-inset-top, 0px);
      padding-bottom: var(--tg-safe-area-inset-bottom, 0px);
      opacity: 0; /* for fade in */
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px 16px;
      position: sticky;
      top: 0;
      background: rgba(15, 18, 24, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10;
      border-bottom: 1px solid var(--border);
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #F59E0B, #EF4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .icon-btn:active {
      transform: scale(0.95);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:active {
      transform: scale(0.96) translateY(2px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    
    .card:active::after {
      opacity: 1;
    }

    .icon-wrapper {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    
    .skeleton {
      animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="title">Меню</div>
    <div class="icon-btn" id="refreshBtn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </div>
  </header>

  <div class="grid" id="menuGrid">
    <!-- Skeletons will be replaced by JS -->
  </div>

  <script>
    // Init Telegram
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.expand();
      tg.setHeaderColor('#0F1218');
      tg.setBackgroundColor('#0F1218');
      tg.ready();
    }

    const categories = [
      { id: '1', name: 'Напитки', color: '#F59E0B', icon: '<path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line>' },
      { id: '2', name: 'Шаурма', color: '#EF4444', icon: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line>' },
      { id: '3', name: 'Хот-доги', color: '#10B981', icon: '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>' },
      { id: '4', name: 'Соусы', color: '#8B5CF6', icon: '<path d="M12 2v20"></path><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>' },
      { id: '5', name: 'Гарниры', color: '#3B82F6', icon: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>' },
      { id: '6', name: 'Пицца', color: '#EC4899', icon: '<path d="M12 2L2 22h20L12 2z"></path><path d="M12 11h.01"></path><path d="M16 16h.01"></path><path d="M8 16h.01"></path>' },
    ];

    const grid = document.getElementById('menuGrid');

    // Show skeletons first to demonstrate speed
    for(let i=0; i<6; i++) {
      grid.innerHTML += `<div class="card skeleton" style="height: 156px"></div>`;
    }

    // Instantly render real content (simulate 150ms network request)
    setTimeout(() => {
      grid.innerHTML = '';
      categories.forEach(cat => {
        grid.innerHTML += `
          <div class="card" onclick="window.Telegram.WebApp.HapticFeedback.impactOccurred('light')">
            <div class="icon-wrapper" style="background: ${cat.color}">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                ${cat.icon}
              </svg>
            </div>
            <div class="card-title">${cat.name}</div>
          </div>
        `;
      });
    }, 150);

    // Refresh animation demo
    document.getElementById('refreshBtn').addEventListener('click', () => {
      window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
      const icon = document.querySelector('#refreshBtn svg');
      icon.style.transition = 'transform 0.5s ease';
      icon.style.transform = `rotate(${Math.random() * 360 + 360}deg)`;
    });
  </script>
</body>
</html>
