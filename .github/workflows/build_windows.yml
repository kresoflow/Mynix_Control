name: Build Windows App (Manual)

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Native Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Build Windows Application
        working-directory: ./frontend
        run: flutter build windows --release --dart-define=API_URL=https://api.kresoflow.com/api/v1 --dart-define=WS_URL=wss://api.kresoflow.com/ws

      - name: Prepare Windows Release Distribution
        shell: pwsh
        run: |
          $releaseDir = (Get-ChildItem -Path "frontend/build/windows" -Directory -Recurse | Where-Object { $_.Name -eq "Release" -and (Test-Path (Join-Path $_.FullName "kreso_flow.exe")) } | Select-Object -First 1).FullName
          if (-not $releaseDir) {
            Write-Error "Release directory containing kreso_flow.exe not found!"
            exit 1
          }
          Write-Host "Found Release bundle at: $releaseDir"
          New-Item -ItemType Directory -Path "dist" -Force
          Copy-Item -Path "$releaseDir\*" -Destination "dist" -Recurse
          Write-Host "Prepared distribution files in dist:"
          Get-ChildItem -Path "dist" | Select-Object Name, Length

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kreso-flow-windows-x64
          path: dist/
          retention-days: 14
          if-no-files-found: error
