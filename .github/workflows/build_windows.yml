name: Build Windows App (Manual)

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Native Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Build Windows Application
        working-directory: ./frontend
        run: flutter build windows --release --dart-define=API_URL=https://api.kresoflow.com/api/v1 --dart-define=WS_URL=wss://api.kresoflow.com/ws

      - name: Prepare and Package Windows Release
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "frontend" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "kreso_flow.exe not found after build!"
            exit 1
          }
          $releaseDir = $exe.Directory.FullName
          Write-Host "Found Release bundle at: $releaseDir"
          New-Item -ItemType Directory -Path "dist" -Force
          Copy-Item -Path "$releaseDir\*" -Destination "dist" -Recurse
          Compress-Archive -Path "dist\*" -DestinationPath "kreso_flow_windows_x64.zip" -Force
          Get-Item "kreso_flow_windows_x64.zip" | Select-Object Name, Length

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kreso-flow-windows-x64
          path: kreso_flow_windows_x64.zip
          retention-days: 14
          if-no-files-found: error
