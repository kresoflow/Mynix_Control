<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mynix Control</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      window.addEventListener('load', function() {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.expand();
          window.Telegram.WebApp.setHeaderColor('#0F1218');
          window.Telegram.WebApp.setBackgroundColor('#0F1218');
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F1218;
      --surface: #1C2029;
      --card: #272C39;
      --text: #F3F4F6;
      --text-muted: #9CA3AF;
      --primary: #F59E0B;
      --border: rgba(255, 255, 255, 0.08);
      
      /* Telegram sync */
      --tg-theme-bg-color: var(--bg);
      --tg-theme-text-color: var(--text);
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      padding-top: var(--tg-safe-area-inset-top, 0px);
      padding-bottom: var(--tg-safe-area-inset-bottom, 0px);
    }
    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
    }
  </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
